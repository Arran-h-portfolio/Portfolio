```yaml
name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish app
        run: dotnet publish -c Release -o release

      - name: Rewrite base href
        run: sed -i 's|<base href="/" />|<base href="/Portfolio/" />|g' release/wwwroot/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
```
Make sure to replace `YOUR_REPO_NAME` in the `Rewrite base href` step with the actual name of your GitHub repository. 
This workflow will build your Blazor WebAssembly application, adjust the base href for GitHub Pages,
and deploy it to the `gh-pages` branch automatically whenever you push to the `main` branch.