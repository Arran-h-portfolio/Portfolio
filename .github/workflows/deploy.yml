name: Deploy Blazor WASM to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        run: dotnet publish MyPortfolioSite/MyPortfolioSite.csproj -c Release -o release

      - name: Rewrite base href
        run: sed -i 's|<base href="/" />|<base href="/Portfolio/" />|g' release/wwwroot/index.html

      - name: Bust CSS cache
        run: |
          TS=$(date +%Y%m%d%H%M%S)
          sed -i "s|href=\"css/app\.css[^\"]*\"|href=\"css/app.css?v=${TS}\"|g" release/wwwroot/index.html
          sed -i "s|href=\"MyPortfolioSite\.styles\.css[^\"]*\"|href=\"MyPortfolioSite.styles.css?v=${TS}\"|g" release/wwwroot/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
